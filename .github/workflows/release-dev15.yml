name: SunnyTV dev15 shadow alignment and signed upgrade

on:
  push:
    branches: ['release/dev15-shadow-alignment']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sunnytv-dev15-release
  cancel-in-progress: false

jobs:
  verify-and-release:
    if: github.repository == 'xudong7587/SunnyTV' && github.ref == 'refs/heads/release/dev15-shadow-alignment'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Commit guarded incremental edits before building
        run: |
          set -euo pipefail
          python3 scripts/apply-dev15-hotfix.py
          git add app/src/main/java/io/github/xudong7587/sunnytv/feature/ui/Components.kt \
            app/src/main/java/io/github/xudong7587/sunnytv/feature/ui/HomeHeroContent.kt \
            app/src/main/java/io/github/xudong7587/sunnytv/feature/ui/Motion.kt \
            app/src/main/java/io/github/xudong7587/sunnytv/feature/ui/TvAccordion.kt \
            app/src/main/java/io/github/xudong7587/sunnytv/feature/ui/CinemaComponents.kt app/build.gradle.kts AGENTS.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'fix: align hero edges, keep fixed-height rows level and lock dev14 signing'
            git push origin HEAD:refs/heads/release/dev15-shadow-alignment
          fi
          echo "CODE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install fixed Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Require the existing signing key and pinned dev14 APK
        env:
          KEY_B64: ${{ secrets.SUNNYTV_DEBUG_KEYSTORE_B64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEY_B64" || { echo 'Signing secret missing; new random key fallback is forbidden.' >&2; exit 1; }
          mkdir -p "$HOME/.android" previous build-logs
          printf '%s' "$KEY_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          gh release download v0.1.0-dev14 --repo "$GITHUB_REPOSITORY" --pattern SunnyTV-v0.1.0-dev14.apk --dir previous
          printf '%s  %s\n' '6f798dae3c4b3d3dd9dbd969859a6e190d49fc642d4fa41fe346eb1325538b04' previous/SunnyTV-v0.1.0-dev14.apk | sha256sum --check -
      - name: Unit tests, lint and Android compilation
        run: |
          set -euo pipefail
          chmod +x gradlew
          python3 scripts/check-project.py | tee build-logs/project-check.log
          ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest \
            2>&1 | tee build-logs/android-build.log
      - name: Block release unless certificate matches dev14
        run: |
          set -euo pipefail
          python3 scripts/verify-release-signer.py --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --baseline previous/SunnyTV-v0.1.0-dev14.apk --candidate app/build/outputs/apk/debug/app-debug.apk \
            --out build-logs/signing-validation.json
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > build-logs/apk-badging.txt
          grep -q "package: name='io.github.xudong7587.sunnytv.debug' versionCode='15' versionName='0.1.0-dev15'" build-logs/apk-badging.txt
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Upgrade from dev14 and verify rendered shadows plus D-pad navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          ram-size: 1536M
          heap-size: 256M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -skin 1920x1080 -cores 2
          script: bash scripts/run-dev15-emulator.sh
      - name: Package tested build and visual evidence
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SunnyTV-v0.1.0-dev15.apk
          cp build-logs/signing-validation.json dist/SIGNING_VALIDATION.json
          cp build-logs/upgrade-test.txt dist/UPGRADE_TEST.txt
          test -f build-logs/visual-dev15/shadow-focused.png
          test -f build-logs/visual-dev15/carousel-aligned.png
          cat build-logs/visual-dev15/pixel-metrics.txt
          zip -j dist/SunnyTV-dev15-visual-checks.zip build-logs/visual-dev15/*
          printf 'version=0.1.0-dev15\nversionCode=15\ncommit=%s\napplicationId=io.github.xudong7587.sunnytv.debug\nsameSignerAsDev14=yes\nemulatorUpgradePreservesData=yes\n' "$CODE_SHA" > dist/BUILD_INFO.txt
          (cd dist && sha256sum *.apk *.json *.txt *.zip > SHA256SUMS.txt)
      - name: Publish dev15 only after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.0-dev15 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace an existing tag or APK.' >&2
            exit 1
          fi
          cp docs/RELEASE-dev15.md build-logs/release-notes.md
          printf '\n实际构建源码：`%s`。\n\n已验证：单元测试、lint、APK 编译、9 项 Android 模拟器回归；与 dev14 签名一致，模拟器 `adb install -r` 覆盖升级且本地标记保留。\n\n附带截图为合成数据的原生 Android 测试画面，不是用户电视截图。\n' "$CODE_SHA" >> build-logs/release-notes.md
          gh release create v0.1.0-dev15 dist/SunnyTV-v0.1.0-dev15.apk dist/BUILD_INFO.txt dist/SHA256SUMS.txt \
            dist/SIGNING_VALIDATION.json dist/UPGRADE_TEST.txt dist/SunnyTV-dev15-visual-checks.zip \
            --repo "$GITHUB_REPOSITORY" --target "$CODE_SHA" --title 'SunnyTV v0.1.0-dev15 · 可见柔和投影与轮播对齐' \
            --notes-file build-logs/release-notes.md --prerelease
      - name: Preserve build logs and screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SunnyTV-dev15-validation
          if-no-files-found: warn
          path: |
            build-logs/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            dist/BUILD_INFO.txt
            dist/SIGNING_VALIDATION.json
      - name: Remove ephemeral runner key copy
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
