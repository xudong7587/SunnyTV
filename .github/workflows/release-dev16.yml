name: Publish verified SunnyTV dev16
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-dev16.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sunnytv-dev16-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'xudong7587/SunnyTV' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Require existing signing key
        env:
          KEY_B64: ${{ secrets.SUNNYTV_DEBUG_KEYSTORE_B64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEY_B64" || { echo 'Signing secret missing; replacement keys are forbidden.' >&2; exit 1; }
          mkdir -p "$HOME/.android" build-logs
          printf '%s' "$KEY_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          # Hash only the public certificate; never print or upload the private key.
          certificate=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          printf 'keystoreCertificateSha256=%s\n' "$certificate" | tee build-logs/keystore-certificate.txt
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
      - name: Build and validate
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          chmod +x gradlew
          python3 scripts/test-bootstrap.py
          python3 scripts/check-project.py
          ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest 2>&1 | tee build-logs/android-build.log
          python3 scripts/verify-release-signer.py --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" --expected-certificate-sha256 "$(cut -d = -f 2 build-logs/keystore-certificate.txt)" --candidate app/build/outputs/apk/debug/app-debug.apk --out build-logs/signing-validation.json
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > build-logs/apk-badging.txt
          grep -q "package: name='io.github.xudong7587.sunnytv.debug' versionCode='16' versionName='0.1.0-dev16'" build-logs/apk-badging.txt
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify Android interactions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -skin 1920x1080 -cores 2
          script: bash scripts/run-dev16-emulator.sh
      - name: Publish without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.0-dev16 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release exists; refusing to replace tag or assets.' >&2; exit 1
          fi
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SunnyTV-v0.1.0-dev16.apk
          cp build-logs/signing-validation.json dist/SIGNING_VALIDATION.json
          printf 'version=0.1.0-dev16\nversionCode=16\ncommit=%s\napplicationId=io.github.xudong7587.sunnytv.debug\nsigner=existingRepositorySecret\n' "$GITHUB_SHA" > dist/BUILD_INFO.txt
          (cd dist && sha256sum *.apk *.json *.txt > SHA256SUMS.txt)
          gh release create v0.1.0-dev16 dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'SunnyTV v0.1.0-dev16 · 焦点导航、首页排序与播放控制' --notes-file docs/RELEASE-dev16.md --prerelease
      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SunnyTV-dev16-validation
          path: |
            build-logs/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
      - name: Remove ephemeral runner key copy
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
