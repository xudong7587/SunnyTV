name: Publish verified SunnyTV stable
on:
  workflow_dispatch:
    inputs:
      candidate_apk_sha256:
        description: 'Optional SHA256 of the already tested APK in a new exact-commit draft release'
        required: false
        type: string
  # One-off publication requested for 0.2.8; main-only and immutable-release checks remain.
  push:
    branches: [main]
    paths: ['docs/RELEASE-0.2.8.md']
permissions:
  contents: write
concurrency:
  group: sunnytv-stable-release
  cancel-in-progress: true
jobs:
  release:
    if: github.repository == 'xudong7587/SunnyTV' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CANDIDATE_APK_SHA256: ${{ inputs.candidate_apk_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Select numeric stable version
        run: |
          python3 - <<'PY'
          import os,re,pathlib
          text=pathlib.Path('app/build.gradle.kts').read_text()
          version=re.search(r'versionName = "([0-9]+\.[0-9]+\.[0-9]+)"',text)
          code=re.search(r'versionCode = ([0-9]+)',text)
          assert version and code, 'A numeric stable version is required'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'VERSION={version[1]}\nVERSION_CODE={code[1]}\n')
          PY
      - name: Build pinned local audio decoders
        run: |
          set -euo pipefail
          sdkmanager 'ndk;26.1.10909125' 'cmake;3.22.1'
          bash scripts/build-audio-decoders.sh 2>&1 | tee audio-build.log
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p app/src/androidTest/assets
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:sample_rate=48000' -ac 6 -c:a eac3 -b:a 768k -frames:a 1 -f eac3 app/src/androidTest/assets/tone.eac3
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:sample_rate=48000' -ac 6 -c:a dca -strict -2 -b:a 1411200 -frames:a 1 -f dts app/src/androidTest/assets/tone.dts
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:sample_rate=44100' -ac 2 -c:a aac -b:a 128k -frames:a 1 -f adts app/src/androidTest/assets/tone-stereo.aac
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:sample_rate=44100' -ac 6 -c:a aac -b:a 384k -frames:a 1 -f adts app/src/androidTest/assets/tone-surround.aac
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:sample_rate=44100' -ac 8 -c:a aac -b:a 512k -frames:a 1 -f adts app/src/androidTest/assets/tone-eight.aac
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:sample_rate=44100' -ac 6 -c:a aac -aac_pce 1 -b:a 384k -frames:a 3 -f adts app/src/androidTest/assets/tone-pce-surround.aac
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:sample_rate=44100' -ac 8 -c:a aac -aac_pce 1 -b:a 512k -frames:a 3 -f adts app/src/androidTest/assets/tone-pce-eight.aac
          mkdir -p app/src/androidTest/assets/quality
          ffmpeg -v error -f lavfi -i 'color=c=blue:s=320x180:r=24:d=12' -f lavfi -i 'sine=frequency=440:sample_rate=44100:duration=12' -c:v libx264 -threads 1 -preset ultrafast -g 24 -pix_fmt yuv420p -c:a aac -aac_pce 1 -ac 8 -b:a 512k -t 12 -f hls -hls_time 2 -hls_list_size 0 -hls_segment_filename 'app/src/androidTest/assets/quality/pce-%d.ts' app/src/androidTest/assets/quality/pce.m3u8
      - name: Select existing repository signing key
        env:
          KEY_B64: ${{ secrets.SUNNYTV_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEY_B64" || { echo 'Existing signing Secret missing; no replacement key permitted.' >&2; exit 1; }
          mkdir -p "$HOME/.android" build-logs
          printf '%s' "$KEY_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          certificate=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          printf 'keystoreCertificateSha256=%s\n' "$certificate" > build-logs/keystore-certificate.txt
          echo "SUNNYTV_SIGNING_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      - name: Build and verify release
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          chmod +x gradlew
          python3 scripts/test-bootstrap.py
          python3 scripts/check-project.py
          python3 scripts/test-release-package.py
          python3 scripts/test-stable-candidate.py
          ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug lintRelease assembleRelease assembleDebugAndroidTest 2>&1 | tee build-logs/android-build.log
          python3 scripts/verify-release-package.py --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --apk app/build/outputs/apk/release/app-release.apk --version-code "$VERSION_CODE" --version-name "$VERSION"
          python3 scripts/verify-release-signer.py --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" --expected-certificate-sha256 "$(cut -d = -f 2 build-logs/keystore-certificate.txt)" --candidate app/build/outputs/apk/release/app-release.apk --out build-logs/signing-validation.json
      - name: Verify the optional device-tested distribution candidate
        if: inputs.candidate_apk_sha256 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/verify-stable-candidate.py --sha256 "$CANDIDATE_APK_SHA256" --version "$VERSION" --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --rebuilt app/build/outputs/apk/release/app-release.apk --native-baseline dcc09409c98f0819b63f763913e57cc822fdaec6
          candidate="build-logs/device-tested-candidate/SunnyTV-v${VERSION}.apk"
          python3 scripts/verify-release-package.py --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --apk "$candidate" --version-code "$VERSION_CODE" --version-name "$VERSION"
          python3 scripts/verify-release-signer.py --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" --expected-certificate-sha256 "$(cut -d = -f 2 build-logs/keystore-certificate.txt)" --candidate "$candidate" --out build-logs/signing-validation.json
      - name: Enable KVM for decoder verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native audio decoding on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          script: |
            ./gradlew --no-daemon --console=plain connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=androidx.media3.decoder.ffmpeg.LocalAudioDecoderTest,io.github.xudong7587.sunnytv.GithubUpdatePanelTest,io.github.xudong7587.sunnytv.PlayerPanelFocusTest,io.github.xudong7587.sunnytv.CloudQualityPlaybackTest,io.github.xudong7587.sunnytv.PlayerQualityBadgeTest,io.github.xudong7587.sunnytv.CloudSubtitleContinuityTest,io.github.xudong7587.sunnytv.HomeBannerCacheTest,io.github.xudong7587.sunnytv.StartupCacheTest,io.github.xudong7587.sunnytv.UgreenConnectionUiTest,io.github.xudong7587.sunnytv.HomeNavigationEntryTest,io.github.xudong7587.sunnytv.ExperimentalUpdateTest,io.github.xudong7587.sunnytv.ExperimentalUpdateUiTest,io.github.xudong7587.sunnytv.AutomaticUpdateStartupTest
            if [ -n "$CANDIDATE_APK_SHA256" ]; then bash scripts/verify-stable-candidate-android.sh; fi
      - name: Publish a new immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current_sha" = "$GITHUB_SHA" || { echo 'Superseded build; refusing publication.'; exit 1; }
          if [ -z "$CANDIDATE_APK_SHA256" ] && gh release view v${VERSION} --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release exists; refusing to replace it.' >&2; exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v${VERSION} >/dev/null 2>&1; then
            echo 'Tag exists; refusing to replace it.' >&2; exit 1
          fi
          mkdir -p dist
          if [ -n "$CANDIDATE_APK_SHA256" ]; then
            # Recheck draft identity immediately before adding assets or publishing it.
            python3 - <<'PY'
          import importlib.util,os
          spec=importlib.util.spec_from_file_location('candidate','scripts/verify-stable-candidate.py')
          module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          module.validate_draft(module.read_release(os.environ['GITHUB_REPOSITORY'],os.environ['VERSION']),os.environ['VERSION'],os.environ['GITHUB_SHA'],os.environ['CANDIDATE_APK_SHA256'])
          PY
            cp "build-logs/device-tested-candidate/SunnyTV-v${VERSION}.apk" "dist/SunnyTV-v${VERSION}.apk"
            printf '%s  %s\n' "$CANDIDATE_APK_SHA256" "dist/SunnyTV-v${VERSION}.apk" | sha256sum --check
          else
            cp app/build/outputs/apk/release/app-release.apk dist/SunnyTV-v${VERSION}.apk
          fi
          cp build-logs/signing-validation.json dist/SIGNING_VALIDATION.json
          printf 'version=%s\nversionCode=%s\ncommit=%s\napplicationId=io.github.xudong7587.sunnytv.debug\nsigner=existingRepositorySecret\ndebuggable=false\nbundledUserFonts=none\ncarlink=false\n' "$VERSION" "$VERSION_CODE" "$GITHUB_SHA" > dist/BUILD_INFO.txt
          git -C decoder-ffmpeg/src/main/jni/ffmpeg archive HEAD | gzip > dist/FFmpeg-n6.0.1-source.tar.gz
          python3 scripts/package-native-relink.py --out "dist/SunnyTV-${VERSION}-native-relink.tar.gz"
          tar -czf dist/FFmpeg-${VERSION}-static-libraries.tar.gz decoder-ffmpeg/src/main/jni/ffmpeg/android-libs
          if [ -n "$CANDIDATE_APK_SHA256" ]; then
            cp build-logs/candidate-validation.json dist/CANDIDATE_VALIDATION.json
            printf 'apkProvenance=deviceTestedCandidate\napkSha256=%s\n' "$CANDIDATE_APK_SHA256" >> dist/BUILD_INFO.txt
          fi
          (cd dist && sha256sum *.apk *.json *.txt *.tar.gz > SHA256SUMS.txt)
          if [ -n "$CANDIDATE_APK_SHA256" ]; then
            # Never overwrite the draft APK that was selected and verified above.
            for asset in dist/*; do
              case "$asset" in *.apk) continue;; esac
              gh release upload "v${VERSION}" "$asset" --repo "$GITHUB_REPOSITORY"
            done
            gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest --title "SunnyTV ${VERSION}" --notes-file "docs/RELEASE-${VERSION}.md"
          else
            gh release create v${VERSION} dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SunnyTV ${VERSION}" --notes-file "docs/RELEASE-${VERSION}.md" --latest
          fi
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SunnyTV-stable-validation
          path: |
            build-logs/
            audio-build.log
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
      - name: Remove ephemeral runner key copy
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"

