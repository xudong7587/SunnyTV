# SunnyTV 0.1.0-dev2 | One-file browser setup + Android CI
# Generated by scripts/export-github-bootstrap.py. Embedded seed SHA-256: 57cff7ca848cd0127dcbbb2d28968972a58892692b800066e9f5f8e6d0077dbe
# The seed runs ONLY in an empty xudong7587/SunnyTV repository; it never overwrites an app.
name: SunnyTV initialize and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sunnytv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Restrict initialization to the requested repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${REPOSITORY,,}" != 'xudong7587/sunnytv' ]]; then
            echo 'This initializer is restricted to xudong7587/SunnyTV. No files were restored.'
            exit 1
          fi
      - name: Validate and restore the embedded source snapshot
        id: seed
        env:
          SUNNYTV_SEED_000: ""
          SUNNYTV_SEED_001: ""
          SUNNYTV_SEED_002: ""
          SUNNYTV_SEED_003: ""
          SUNNYTV_SEED_004: ""
          SUNNYTV_SEED_005: ""
          SUNNYTV_SEED_006: ""
          SUNNYTV_SEED_007: ""
          SUNNYTV_SEED_008: ""
          SUNNYTV_SEED_009: ""
          SUNNYTV_SEED_010: ""
          SUNNYTV_SEED_011: ""
          SUNNYTV_SEED_012: ""
          SUNNYTV_SEED_013: ""
          SUNNYTV_SEED_014: ""
          SUNNYTV_SEED_015: ""
          SUNNYTV_SEED_COUNT: "16"
          SUNNYTV_SEED_SHA256: "57cff7ca848cd0127dcbbb2d28968972a58892692b800066e9f5f8e6d0077dbe"
        run: |
          python3 - <<'SUNNYTV_PY'
          """Restore a checksum-verified SunnyTV seed into a newly created repository.

          This module has no network or Git writes. CI decides whether/when to commit.
          It refuses to overwrite an existing app or modify .git/.github or signing keys.
          """
          from __future__ import annotations

          import hashlib
          import io
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          MAX_ARCHIVE_BYTES = 4 * 1024 * 1024
          MAX_EXPANDED_BYTES = 12 * 1024 * 1024
          MAX_FILES = 512
          REQUIRED = {"settings.gradle.kts", "app/build.gradle.kts", "AGENTS.md"}


          def restore_zip(payload: bytes, target: Path, expected_sha256: str) -> str:
              target = target.resolve()
              if len(payload) > MAX_ARCHIVE_BYTES:
                  raise ValueError("Seed archive too large")
              if hashlib.sha256(payload).hexdigest() != expected_sha256:
                  raise ValueError("Seed SHA-256 mismatch; no files were written")
              target.mkdir(parents=True, exist_ok=True)
              if (target / "app/build.gradle.kts").exists():
                  return "already-initialized"

              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  members = archive.infolist()
                  if not members or len(members) > MAX_FILES:
                      raise ValueError("Invalid file count")
                  if sum(m.file_size for m in members) > MAX_EXPANDED_BYTES:
                      raise ValueError("Expanded seed too large")
                  prepared: list[tuple[Path, bytes, int]] = []
                  names: set[str] = set()
                  for member in members:
                      name = member.filename
                      path = PurePosixPath(name)
                      if member.is_dir() or path.is_absolute() or "\\" in name or ":" in name:
                          raise ValueError("Unsupported archive member")
                      if not path.parts or any(p in ("", ".", "..", ".git", ".github") for p in path.parts):
                          raise ValueError("Unsafe archive path")
                      if str(path) != name or name in names:
                          raise ValueError("Duplicate or ambiguous archive member")
                      if name.lower().endswith((".jks", ".keystore", ".p12", ".pem", ".key")) or path.name in (".env", "local.properties"):
                          raise ValueError("Credentials or machine-local config are not allowed")
                      mode = member.external_attr >> 16
                      if stat.S_ISLNK(mode):
                          raise ValueError("Archive symlinks are forbidden")
                      destination = target / path
                      if not destination.resolve().is_relative_to(target):
                          raise ValueError("Destination escapes repository")
                      if destination.is_symlink() or any(p.is_symlink() for p in destination.parents if p != target.parent):
                          raise ValueError("Destination contains symlink")
                      if destination.exists() and name != "README.md":
                          raise ValueError("Existing file would be overwritten: " + name)
                      names.add(name)
                      # Read and CRC-validate every member BEFORE writing the first file.
                      prepared.append((destination, archive.read(member), mode))
                  if not REQUIRED.issubset(names):
                      raise ValueError("Seed does not contain a SunnyTV Android project")
                  # A starter README is allowed; all other pre-existing project content is refused.
                  for p in target.rglob("*"):
                      rel = p.relative_to(target)
                      if rel.parts[0] in (".git", ".github"):
                          continue
                      if p.is_file() and str(rel) != "README.md":
                          raise ValueError("Repository is not empty: " + str(rel))
                  readme = target / "README.md"
                  initial_readme = readme.read_bytes() if readme.exists() else None
                  if initial_readme is not None and "docs/INITIAL_REPOSITORY_README.md" in names:
                      raise ValueError("README backup path conflict")
                  for destination, content, mode in prepared:
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(content)
                      destination.chmod(0o755 if mode & 0o111 else 0o644)
                  if initial_readme is not None:
                      backup = target / "docs/INITIAL_REPOSITORY_README.md"
                      backup.parent.mkdir(parents=True, exist_ok=True)
                      backup.write_bytes(initial_readme)
              return "initialized"


          import base64, os
          encoded = "".join(os.environ[f"SUNNYTV_SEED_{i:03d}"] for i in range(int(os.environ["SUNNYTV_SEED_COUNT"])))
          status = restore_zip(base64.b64decode(encoded, validate=True), Path.cwd(), os.environ["SUNNYTV_SEED_SHA256"])
          print("SunnyTV source snapshot: " + status)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as result:
              result.write("initialized=" + ("true" if status == "initialized" else "false") + "\n")
          SUNNYTV_PY
      - name: Publish source before downloading build tools
        if: steps.seed.outputs.initialized == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- . ':!.github'
          git commit -m 'chore: initialize SunnyTV 0.1.0-dev2 source'
          git push origin HEAD:refs/heads/main
          echo 'Source committed. This is not a successful Android build yet.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate a verified standard Gradle Wrapper if missing
        run: |
          set -euo pipefail
          bash scripts/generate-wrapper.sh 2>&1 | tee "$RUNNER_TEMP/sunnytv-wrapper.log"
      - name: Commit only generated wrapper files and record exact build revision
        id: source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m 'build: add verified Gradle 8.11.1 wrapper'
            git push origin HEAD:refs/heads/main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload wrapper diagnostics even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SunnyTV-initialization-logs
          path: ${{ runner.temp }}/sunnytv-wrapper.log
          if-no-files-found: ignore
          retention-days: 14

  android:
    needs: prepare
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install the pinned Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Optional persistent debug signing identity
        if: github.event_name != 'pull_request'
        env:
          KEY_B64: ${{ secrets.SUNNYTV_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$KEY_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEY_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            echo 'No persistent debug key: a later test APK may need uninstall/reinstall. Do not use for production signing.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Offline bootstrap security tests and project checks
        run: |
          set -euo pipefail
          mkdir -p .ci-logs
          python3 scripts/test-bootstrap.py 2>&1 | tee .ci-logs/bootstrap-tests.log
          python3 scripts/check-project.py 2>&1 | tee .ci-logs/source-checks.log
      - name: Unit tests, lint and debug APK
        id: compile
        run: |
          set -euo pipefail
          mkdir -p .ci-logs
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --stacktrace testDebugUnitTest lintDebug assembleDebug 2>&1 | tee .ci-logs/android-build.log
      - name: Package only a successfully built test APK
        if: success()
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          {
            printf 'SunnyTV Android test build\nSource commit: '
            git rev-parse HEAD
            printf '\nBuild and unit/lint success is not a TV playback or performance verification.\n'
            printf 'No Emby/CD2 credentials or signing keys are included in this artifact.\n'
            printf 'A debug APK is not the final performance/production release.\n'
          } > dist/BUILD-INFO.txt
          echo 'APK + SHA256: download SunnyTV-test-apk from this run. Hardware playback is still unverified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Test APK and checksums
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SunnyTV-test-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Build logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SunnyTV-build-reports
          path: |
            .ci-logs/
            app/build/reports/
            app/build/test-results/
            docs/bootstrap-test-results.json
            docs/project-check-results.json
          if-no-files-found: warn
          retention-days: 14
