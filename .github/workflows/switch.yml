name: Switch NRO
on:
  push:
    branches: ['codex/switch-**']
    paths: ['switch/**', '.github/workflows/switch.yml']
  pull_request:
    paths: ['switch/**', '.github/workflows/switch.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install -y g++ pkg-config libcurl4-openssl-dev
      - run: bash switch/tests/run.sh
        env:
          SANITIZE: '1'
  nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Switch libraries
        run: dkp-pacman -Syu --noconfirm --needed switch-libmpv switch-sdl2_ttf switch-sdl2_image switch-curl switch-pkg-config
      - name: Build NRO
        run: |
          . /opt/devkitpro/switchvars.sh
          make -C switch -j2 package
          git rev-parse HEAD > switch/dist/SOURCE_COMMIT.txt
          dkp-pacman -Q > switch/dist/TOOLCHAIN_PACKAGES.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SunnyTV-Switch-0.2.8
          path: switch/dist/
          if-no-files-found: error
