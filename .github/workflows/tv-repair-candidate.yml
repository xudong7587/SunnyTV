name: Verify TV repair candidate
on:
  push:
    branches: [codex/tv-1.0.5-fixes]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sunnytv-tv-repair-candidate
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Select numeric stable version
        run: |
          python3 - <<'PY'
          import os,re,pathlib
          text=pathlib.Path('app/build.gradle.kts').read_text()
          version=re.search(r'versionName = "([0-9]+\.[0-9]+\.[0-9]+)"',text)
          code=re.search(r'versionCode = ([0-9]+)',text)
          assert version and code, 'A numeric stable version is required'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'VERSION={version[1]}\nVERSION_CODE={code[1]}\n')
          PY
      - name: Build pinned local audio decoders
        run: |
          set -euo pipefail
          sdkmanager 'ndk;26.1.10909125' 'cmake;3.22.1'
          bash scripts/build-audio-decoders.sh 2>&1 | tee audio-build.log
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p app/src/androidTest/assets
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:sample_rate=48000' -ac 6 -c:a eac3 -b:a 768k -frames:a 1 -f eac3 app/src/androidTest/assets/tone.eac3
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:sample_rate=48000' -ac 6 -c:a dca -strict -2 -b:a 1411200 -frames:a 1 -f dts app/src/androidTest/assets/tone.dts
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:sample_rate=44100' -ac 2 -c:a aac -b:a 128k -frames:a 1 -f adts app/src/androidTest/assets/tone-stereo.aac
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:sample_rate=44100' -ac 6 -c:a aac -b:a 384k -frames:a 1 -f adts app/src/androidTest/assets/tone-surround.aac
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:sample_rate=44100' -ac 8 -c:a aac -b:a 512k -frames:a 1 -f adts app/src/androidTest/assets/tone-eight.aac
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:sample_rate=44100' -ac 6 -c:a aac -aac_pce 1 -b:a 384k -frames:a 3 -f adts app/src/androidTest/assets/tone-pce-surround.aac
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:sample_rate=44100' -ac 8 -c:a aac -aac_pce 1 -b:a 512k -frames:a 3 -f adts app/src/androidTest/assets/tone-pce-eight.aac
          mkdir -p app/src/androidTest/assets/quality
          ffmpeg -v error -f lavfi -i 'color=c=blue:s=320x180:r=24:d=12' -f lavfi -i 'sine=frequency=440:sample_rate=44100:duration=12' -c:v libx264 -threads 1 -preset ultrafast -g 24 -pix_fmt yuv420p -c:a aac -aac_pce 1 -ac 8 -b:a 512k -t 12 -f hls -hls_time 2 -hls_list_size 0 -hls_segment_filename 'app/src/androidTest/assets/quality/pce-%d.ts' app/src/androidTest/assets/quality/pce.m3u8
          ffmpeg -v error -f lavfi -i 'color=c=gray:s=320x180:r=24:d=12' -vf 'drawbox=x=0:y=0:w=iw:h=18:c=red:t=fill,drawbox=x=0:y=162:w=iw:h=18:c=blue:t=fill,drawbox=x=0:y=18:w=32:h=144:c=yellow:t=fill,drawbox=x=288:y=18:w=32:h=144:c=green:t=fill' -c:v libx264 -threads 1 -preset ultrafast -pix_fmt yuv420p -movflags +faststart app/src/androidTest/assets/ambilight.mp4
          ffmpeg -v error -f lavfi -i 'color=c=blue:s=320x180:r=10:d=12' -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=12' -f lavfi -i 'sine=frequency=880:sample_rate=48000:duration=12' -map 0:v -map 1:a -map 2:a -c:v libx264 -threads 1 -preset ultrafast -pix_fmt yuv420p -c:a aac -metadata:s:a:0 language=eng -metadata:s:a:1 language=jpn -disposition:a:0 default -disposition:a:1 0 -t 12 app/src/androidTest/assets/quality/multi-audio.mkv
          python3 scripts/generate-framing-fixture.py
      - name: Select existing repository signing key
        env:
          KEY_B64: ${{ secrets.SUNNYTV_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEY_B64" || { echo 'Existing signing Secret missing; no replacement key permitted.' >&2; exit 1; }
          mkdir -p "$HOME/.android" build-logs
          printf '%s' "$KEY_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          certificate=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          printf 'keystoreCertificateSha256=%s\n' "$certificate" > build-logs/keystore-certificate.txt
          echo "SUNNYTV_SIGNING_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      - name: Build and verify release
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          chmod +x gradlew
          python3 scripts/test-bootstrap.py
          python3 scripts/check-project.py
          python3 scripts/test-release-package.py
          python3 scripts/test-stable-candidate.py
          ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug lintRelease assembleRelease assembleDebugAndroidTest 2>&1 | tee build-logs/android-build.log
          python3 scripts/verify-release-package.py --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --apk app/build/outputs/apk/release/app-release.apk --version-code "$VERSION_CODE" --version-name "$VERSION"
          python3 scripts/verify-release-signer.py --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" --expected-certificate-sha256 "$(cut -d = -f 2 build-logs/keystore-certificate.txt)" --candidate app/build/outputs/apk/release/app-release.apk --out build-logs/signing-validation.json
      - name: Enable KVM for decoder verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native audio decoding on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          script: |
            ./gradlew --no-daemon --console=plain connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.xudong7587.sunnytv.AboutProjectsTest,io.github.xudong7587.sunnytv.AmbilightLifecycleTest,io.github.xudong7587.sunnytv.AmbilightSettingsTest,io.github.xudong7587.sunnytv.AmbilightSurfaceTest,androidx.media3.decoder.ffmpeg.LocalAudioDecoderTest,io.github.xudong7587.sunnytv.GithubUpdatePanelTest,io.github.xudong7587.sunnytv.PlayerPanelFocusTest,io.github.xudong7587.sunnytv.CloudQualityPlaybackTest,io.github.xudong7587.sunnytv.PlayerQualityBadgeTest,io.github.xudong7587.sunnytv.CloudSubtitleContinuityTest,io.github.xudong7587.sunnytv.HomeBannerCacheTest,io.github.xudong7587.sunnytv.StartupCacheTest,io.github.xudong7587.sunnytv.UgreenConnectionUiTest,io.github.xudong7587.sunnytv.HomeNavigationEntryTest,io.github.xudong7587.sunnytv.ExperimentalUpdateTest,io.github.xudong7587.sunnytv.ExperimentalUpdateUiTest,io.github.xudong7587.sunnytv.AutomaticUpdateStartupTest
            ./gradlew --no-daemon --console=plain -PsunnytvTestBuildType=release assembleReleaseAndroidTest
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb install -r app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb shell am instrument -w -r -e class io.github.xudong7587.sunnytv.FullBufferSamplingTest,io.github.xudong7587.sunnytv.LegacyGlassTest,io.github.xudong7587.sunnytv.PlayerFramingTest,io.github.xudong7587.sunnytv.PlayerResizeTest io.github.xudong7587.sunnytv.debug.test/androidx.test.runner.AndroidJUnitRunner | tee build-logs/tv-repair-android.txt
            python3 -c 'from pathlib import Path; s=Path("build-logs/tv-repair-android.txt").read_text(); assert "OK (" in s and "FAILURES" not in s and "INSTRUMENTATION_FAILED" not in s, s'
      - name: Verify final release on Android TV system image
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          avd-name: sunnytv-tv
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb install -r app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb shell am instrument -w -r -e requireTv true -e class io.github.xudong7587.sunnytv.FullBufferSamplingTest,io.github.xudong7587.sunnytv.LegacyGlassTest,io.github.xudong7587.sunnytv.PlayerFramingTest,io.github.xudong7587.sunnytv.PlayerResizeTest io.github.xudong7587.sunnytv.debug.test/androidx.test.runner.AndroidJUnitRunner | tee build-logs/tv-system-android.txt
            python3 -c 'from pathlib import Path; s=Path("build-logs/tv-system-android.txt").read_text(); assert "OK (" in s and "FAILURES" not in s and "INSTRUMENTATION_FAILED" not in s, s'
      - name: Package signed test candidate (no release publication)
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SunnyTV-v${VERSION}-${VERSION_CODE}-candidate.apk"
          cp build-logs/signing-validation.json dist/
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: SunnyTV-tv-repair-candidate
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SunnyTV-tv-repair-validation
          path: |
            build-logs/
            app/build/reports/
            app/build/outputs/androidTest-results/
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
