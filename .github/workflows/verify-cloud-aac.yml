name: Verify cloud AAC fix candidate
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sunnytv-aac-candidate
  cancel-in-progress: true
jobs:
  release:
    if: github.repository == 'xudong7587/SunnyTV'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Select numeric stable version
        run: |
          python3 - <<'PY'
          import os,re,pathlib
          text=pathlib.Path('app/build.gradle.kts').read_text()
          version=re.search(r'versionName = "([0-9]+\.[0-9]+\.[0-9]+)"',text)
          code=re.search(r'versionCode = ([0-9]+)',text)
          assert version and code, 'A numeric stable version is required'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'VERSION={version[1]}\nVERSION_CODE={code[1]}\n')
          PY
      - name: Build pinned local audio decoders
        run: |
          set -euo pipefail
          sdkmanager 'ndk;26.1.10909125' 'cmake;3.22.1'
          bash scripts/build-audio-decoders.sh 2>&1 | tee audio-build.log
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p app/src/androidTest/assets
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:sample_rate=48000' -ac 6 -c:a eac3 -b:a 768k -frames:a 1 -f eac3 app/src/androidTest/assets/tone.eac3
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:sample_rate=48000' -ac 6 -c:a dca -strict -2 -b:a 1411200 -frames:a 1 -f dts app/src/androidTest/assets/tone.dts
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:sample_rate=44100' -ac 2 -c:a aac -b:a 128k -frames:a 1 -f adts app/src/androidTest/assets/tone-stereo.aac
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:sample_rate=44100' -ac 6 -c:a aac -b:a 384k -frames:a 1 -f adts app/src/androidTest/assets/tone-surround.aac
          ffmpeg -v error -f lavfi -i 'sine=frequency=440:sample_rate=44100' -ac 8 -c:a aac -b:a 512k -frames:a 1 -f adts app/src/androidTest/assets/tone-eight.aac
      - name: Select existing repository signing key
        env:
          KEY_B64: ${{ secrets.SUNNYTV_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEY_B64" || { echo 'Existing signing Secret missing; no replacement key permitted.' >&2; exit 1; }
          mkdir -p "$HOME/.android" build-logs
          printf '%s' "$KEY_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          certificate=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          printf 'keystoreCertificateSha256=%s\n' "$certificate" > build-logs/keystore-certificate.txt
          echo "SUNNYTV_SIGNING_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      - name: Build and verify release
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          chmod +x gradlew
          python3 scripts/test-bootstrap.py
          python3 scripts/check-project.py
          python3 scripts/test-release-package.py
          ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug lintRelease assembleRelease assembleDebugAndroidTest 2>&1 | tee build-logs/android-build.log
          python3 scripts/verify-release-package.py --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --apk app/build/outputs/apk/release/app-release.apk --version-code "$VERSION_CODE" --version-name "$VERSION"
          python3 scripts/verify-release-signer.py --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" --expected-certificate-sha256 "$(cut -d = -f 2 build-logs/keystore-certificate.txt)" --candidate app/build/outputs/apk/release/app-release.apk --out build-logs/signing-validation.json
      - name: Enable KVM for decoder verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native audio decoding on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          script: ./gradlew --no-daemon --console=plain connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=androidx.media3.decoder.ffmpeg.LocalAudioDecoderTest,io.github.xudong7587.sunnytv.PlayerPanelFocusTest,io.github.xudong7587.sunnytv.CloudQualityPlaybackTest,io.github.xudong7587.sunnytv.PlayerQualityBadgeTest,io.github.xudong7587.sunnytv.CloudSubtitleContinuityTest,io.github.xudong7587.sunnytv.HomeBannerCacheTest,io.github.xudong7587.sunnytv.StartupCacheTest,io.github.xudong7587.sunnytv.UgreenConnectionUiTest,io.github.xudong7587.sunnytv.HomeNavigationEntryTest
      - name: Preserve signed candidate for real-device verification
        uses: actions/upload-artifact@v4
        with:
          name: SunnyTV-aac-candidate
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            build-logs/signing-validation.json
          retention-days: 7
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SunnyTV-stable-validation
          path: |
            build-logs/
            audio-build.log
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
      - name: Remove ephemeral runner key copy
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
